version: 2

# One grouped PR per ecosystem per week, covering every manifest at once.
#
# Before this, each package in each directory got its own PR: the 9/14 sweep
# arrived as 13 PRs for 5 packages, 9 of them strict subsets of the others.
# Worse, the per-directory split let one package land at different floors in
# different manifests — pillow-heif was opened for /idt, /imagedescriber and
# /tools/show_metadata but not for /, /chatapp or pyproject.toml, which would
# have written three different floors for one package into the tree.
#
# `directories` (plural) puts every manifest in a single PR, so a package moves
# everywhere at once or not at all, and `groups` collapses all packages in that
# ecosystem into that one PR.

updates:
  # All Python manifests — root requirements.txt + pyproject.toml, the three
  # app requirements files, and the show_metadata and ImageGallery tools.
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/idt"
      - "/imagedescriber"
      - "/chatapp"          # was missing entirely until 9/14; its openai,
                            # anthropic and pillow-heif pins went untracked
      - "/tools/show_metadata"
      - "/tools/ImageGallery"   # standard library only today; watched so
                                # anything added later is covered
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # The Windows AI helper (windows_ai_helper/) and its tests, in one entry so
  # the test stack moves in both at once.
  #
  # The Windows App SDK packages have a group of their own, listed first. The
  # helper is a packaged exe whose manifest depends on Windows App Runtime 1.8,
  # and the SDK is split into packages (Base, Foundation, AI, Runtime) that
  # must move together. A move there changes what a PC needs installed and has
  # to be tried on a Copilot+ PC, so it should not ride along with routine
  # updates.
  - package-ecosystem: "nuget"
    directories:
      - "/windows_ai_helper/IdtWindowsAI"
      - "/windows_ai_helper/IdtWindowsAI.Tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK*"
      nuget-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.WindowsAppSDK*"
